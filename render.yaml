services:
  - type: web
    name: golis
    env: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: /sitemap.xml
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /googleb86d2b86801ce624.html
        destination: /googleb86d2b86801ce624.html
      - type: rewrite
        source: /*
        destination: /index.html
